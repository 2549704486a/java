spring.application.name=incentive
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:test}
rocketmq.consumer.group=${ROCKETMQ_CONSUMER_GROUP:test_consumer}
rocketmq.topic=${ROCKETMQ_TOPIC:TestTopic}
rocketmq.consumer.max-retry-times=${ROCKETMQ_CONSUMER_MAX_RETRY_TIMES:3}
rocketmq.consumer.enabled=${ROCKETMQ_CONSUMER_ENABLED:true}
rocketmq.dead-letter-consumer.group=${ROCKETMQ_DEAD_LETTER_CONSUMER_GROUP:dead_letter_consumer}
rocketmq.dead-letter-consumer.topic=${ROCKETMQ_DEAD_LETTER_CONSUMER_TOPIC:%DLQ%test_consumer}
rocketmq.dead-letter-consumer.enabled=${ROCKETMQ_DEAD_LETTER_CONSUMER_ENABLED:true}

spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:5000ms}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.lettuce.pool.max-active=${SPRING_DATA_REDIS_POOL_MAX_ACTIVE:32}
spring.data.redis.lettuce.pool.max-wait=${SPRING_DATA_REDIS_POOL_MAX_WAIT:-1ms}
spring.data.redis.lettuce.pool.max-idle=${SPRING_DATA_REDIS_POOL_MAX_IDLE:16}
spring.data.redis.lettuce.pool.min-idle=${SPRING_DATA_REDIS_POOL_MIN_IDLE:8}

spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD:localhost:8081}
spring.cloud.sentinel.transport.port=${SENTINEL_TRANSPORT_PORT:8719}

canal.client.enabled=${CANAL_ENABLED:true}
canal.client.host=${CANAL_HOST:localhost}
canal.client.port=${CANAL_PORT:11111}
canal.client.destination=${CANAL_DESTINATION:example}
canal.client.username=${CANAL_USERNAME:canal}
canal.client.password=${CANAL_PASSWORD:canal}
canal.client.subscribe-pattern=${CANAL_SUBSCRIBE_PATTERN:.*\\.*}
canal.client.batch-size=${CANAL_BATCH_SIZE:200}
canal.client.idle-delay-ms=${CANAL_IDLE_DELAY_MS:2000}
canal.client.retry-interval-ms=${CANAL_RETRY_INTERVAL_MS:10000}

cache.warm.enabled=${CACHE_WARM_ENABLED:true}
cache.warm.award-ids=${CACHE_WARM_AWARD_IDS:1,2,3,4,5,6}
cache.warm.user-currency-enabled=${CACHE_WARM_USER_CURRENCY_ENABLED:true}
cache.warm.user-currency-min-user-id=${CACHE_WARM_USER_CURRENCY_MIN_USER_ID:1}
cache.warm.user-currency-max-user-id=${CACHE_WARM_USER_CURRENCY_MAX_USER_ID:10000}

seckill.old-chain.lock-attempt-rounds=${SECKILL_OLD_CHAIN_LOCK_ATTEMPT_ROUNDS:2}
seckill.old-chain.lock-retry-backoff-millis=${SECKILL_OLD_CHAIN_LOCK_RETRY_BACKOFF_MILLIS:5,15}
seckill.old-chain.split-lock-expire-seconds=${SECKILL_OLD_CHAIN_SPLIT_LOCK_EXPIRE_SECONDS:10}
seckill.old-chain.delayed-retry-enabled=${SECKILL_OLD_CHAIN_DELAYED_RETRY_ENABLED:true}
seckill.old-chain.delayed-retry-max-times=${SECKILL_OLD_CHAIN_DELAYED_RETRY_MAX_TIMES:6}
seckill.old-chain.delayed-retry-delay-levels=${SECKILL_OLD_CHAIN_DELAYED_RETRY_DELAY_LEVELS:1,1,2,2,3,4}

campaign.execution.enabled=${CAMPAIGN_EXECUTION_ENABLED:true}
campaign.execution.scan-interval-ms=${CAMPAIGN_EXECUTION_SCAN_INTERVAL_MS:5000}
campaign.execution.scan-limit=${CAMPAIGN_EXECUTION_SCAN_LIMIT:20}
campaign.execution.treatment-ratio-bps=${CAMPAIGN_TREATMENT_RATIO_BPS:9000}

campaign.delivery.enabled=${CAMPAIGN_DELIVERY_ENABLED:true}
campaign.delivery.topic=${CAMPAIGN_DELIVERY_TOPIC:CampaignDeliveryTopic}
campaign.delivery.producer-group=${CAMPAIGN_DELIVERY_PRODUCER_GROUP:campaign_delivery_producer}
campaign.delivery.consumer-group=${CAMPAIGN_DELIVERY_CONSUMER_GROUP:campaign_delivery_consumer}
campaign.delivery.dispatch-interval-ms=${CAMPAIGN_DELIVERY_DISPATCH_INTERVAL_MS:1000}
campaign.delivery.dispatch-limit=${CAMPAIGN_DELIVERY_DISPATCH_LIMIT:100}
